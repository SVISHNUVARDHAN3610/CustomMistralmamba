name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-description:
    name: Check PR Description
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PR description template
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/validate_pr_description.py

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: pip

      - name: Install ruff
        # Pinned so local pre-commit / CI / requirements.txt all lint with the
        # same ruff revision (unpinned installs drift and flip format rules).
        run: pip install "ruff==0.16.2"

      - name: Run ruff
        run: |
          ruff check .
          ruff format --check .

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run unit tests
        run: python -m unittest tests.test_model -v

      - name: Run training smoke test
        # The only gate exercising chunked-BPTT *backward* (the unit suite
        # covers forward parity); a regression here previously shipped green.
        run: python -m unittest tests.test_toy_train_smoke -v
