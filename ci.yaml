name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pr-description:
    name: Check PR Description
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check PR body is not empty
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"
          if [ -z "$PR_BODY" ] || [ "$(echo "$PR_BODY" | wc -c)" -lt 10 ]; then
            echo "::error::PR description is empty or too short (minimum 10 characters). Please add a meaningful description."
            exit 1
          fi
          echo "PR description check passed."

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: pr-description
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff check (lint)
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

